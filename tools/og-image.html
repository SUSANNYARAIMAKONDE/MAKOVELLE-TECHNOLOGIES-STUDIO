<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0B0B0D;color:#F7F5F0;font-family:Manrope,sans-serif;overflow:hidden}
  .wrap{position:relative;width:100%;height:100%;padding:76px 84px;box-sizing:border-box;display:flex;flex-direction:column}
  .wrap::before{content:"";position:absolute;width:900px;height:900px;right:-300px;top:-380px;background:radial-gradient(closest-side,rgba(214,183,122,.2),transparent 72%)}
  .wrap::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(247,245,240,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(247,245,240,.06) 1px,transparent 1px);background-size:84px 84px;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 80% 30%,#000,transparent 75%)}
  .logo{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
  .logo svg{width:58px;height:58px;color:#D6B77A}
  .name{font-family:"Instrument Serif";font-size:40px;line-height:1}
  .sub{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#9B978F;margin-top:6px;font-weight:600}
  h1{font-family:"Instrument Serif";font-weight:400;font-size:84px;line-height:1;margin:auto 0 26px;max-width:900px;position:relative;z-index:1;letter-spacing:-.01em}
  h1 em{color:#D6B77A}
  .foot{display:flex;gap:28px;font-size:20px;color:#9B978F;position:relative;z-index:1;border-top:1px solid rgba(247,245,240,.12);padding-top:26px}
  .foot span{display:flex;align-items:center;gap:12px}.foot span::before{content:"";width:7px;height:7px;background:#D6B77A;transform:rotate(45deg)}
</style></head>
<body><div class="wrap">
  <div class="logo"><svg viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" fill="none" stroke="currentColor" opacity=".45"/><path d="M10 29V11l10 10.5L30 11v18M20 29v-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
    <div><div class="name">Makovelle</div><div class="sub">Technologies Studio</div></div></div>
  <h1>Building intelligent solutions <em>for modern businesses.</em></h1>
  <div class="foot"><span>Websites</span><span>School systems</span><span>Custom software</span><span>ERP &amp; automation</span></div>
</div></body></html>
