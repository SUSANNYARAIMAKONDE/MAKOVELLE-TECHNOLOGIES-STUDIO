  <header class="site-header" data-header>
    <div class="container site-header__inner">
      <a class="logo" href="/" aria-label="{{site.name}} — home">
        {{> logo}}
        <span class="logo__text"><span class="logo__name">Makovelle</span><span class="logo__sub">Technologies Studio</span></span>
      </a>

      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a class="nav__link" href="/" data-nav="home">Home</a></li>
          <li><a class="nav__link" href="/about/" data-nav="about">About</a></li>
          <li><a class="nav__link" href="/services/" data-nav="services">Services</a></li>

          <li><a class="nav__link" href="/contact/" data-nav="contact">Contact</a></li>
